name = "sigersehat-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Environment variables NON-SECRET (secret wajib via `wrangler secret put`, jangan di sini)
[vars]
APP_ENV = "local"
APP_ORIGIN = "http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "sigersehat-db"
database_id = "66567045-35b8-4cc2-845f-22031bf171d9" # GANTI sesudah `wrangler d1 create sigersehat-db`
migrations_dir = "src/db/migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "sigersehat-files"

[triggers]
crons = ["*/15 * * * *"] # pembuatan notifikasi pengingat & snapshot INSIGHT (Tahap 2 REC-03/Modul REMINDER)
